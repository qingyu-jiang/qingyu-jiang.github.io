title-on-all-pages: true
url: "https://qingyu-jiang.github.io"
baseurl: ""
lang: en
timezone: America/Los_Angeles
mobile-theme-col: "#ffffff"

academic:
  # Shared academic identity. Update here after an affiliation change.
  position: "Assistant Professor"
  affiliation: "University of Idaho"
  department: "Department of Psychology and Communication"
  college: "College of Letters, Arts and Social Sciences"
  office: "Student Health Center 201"
  street_address: "875 Perimeter Drive MS 3043"
  postal_city: "Moscow, ID 83844"
  location: "Moscow, Idaho"
  affiliate_school: "Margaret Ritchie School of Family and Consumer Sciences"
  github_username: qingyu-jiang
  email: "qjiang@uidaho.edu"
  portrait: "/assets/img/portrait.jpg"
  portrait_alt: "Portrait of Qingyu Jiang"
  content_pending: false # Local preview overrides this; approved production content is indexable.
  profiles:
    - label: Faculty Page
      icon: faculty
      url: "https://www.uidaho.edu/people/qjiang"
    - label: Google Scholar
      icon: scholar
      url: "https://scholar.google.com/citations?user=ZQPFSWsAAAAJ&hl=en"
    - label: ResearchGate
      icon: researchgate
      url: "" # Awaiting the supplied profile URL.
    - label: LinkedIn
      icon: linkedin
      url: "" # Awaiting the supplied profile URL.
  navigation:
    - title: Home
      url: /
    - title: Research
      url: /research/
    - title: Teaching
      url: /teaching/
    - title: WHEAT Lab
      url: /wheat-lab/
    - title: Contact
      url: /contact/

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM

defaults:
  - scope:
      path: ""
    values:
      layout: academic
      share-img: /assets/img/portrait.jpg
      head-extra:
        - academic-head-extra.html

plugins:
  - jekyll-sitemap

# Keep reference material, runtime tools and unused theme assets out of the site.
exclude:
  - contexts
  - photo.png
  - .runtime
  - .bundle
  - vendor
  - scripts
  - _config.local.yml
  - docs
  - IMPLEMENTATION-BRIEF.md
  - README.md
  - CHANGELOG.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - Appraisals
  - beautiful-jekyll-theme.gemspec
  - assets/files/README.md
  - assets/files/cv.pdf
  - assets/css/beautifuljekyll.css
  - assets/css/beautifuljekyll-minimal.css
  - assets/css/bootstrap-social.css
  - assets/css/pygment_highlights.css
  - assets/css/staticman.css
  - assets/js/beautifuljekyll.js
  - assets/js/staticman.js

