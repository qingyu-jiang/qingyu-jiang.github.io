{%- assign academic_email = site.academic.email | default: '' | strip -%}
{%- if academic_email != '' -%}
<a href="mailto:{{ academic_email | escape }}">{{ include.label | default: academic_email | escape }}</a>
{%- else -%}
<span class="pending-link">{{ include.label | default: 'Email' | escape }} <small>[needed]</small></span>
{%- endif -%}
