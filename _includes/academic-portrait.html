{% assign portrait = site.academic.portrait | default: '' | strip %}
{% if portrait != '' %}
<img class="portrait" src="{{ portrait | relative_url | escape }}" alt="{{ site.academic.portrait_alt | escape }}" width="250" height="313" fetchpriority="high">
{% else %}
<div class="portrait portrait-placeholder" role="img" aria-label="Portrait placeholder: professional photograph to be supplied">[Your portrait]</div>
{% endif %}
