name: Academic website

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the approved website to GitHub Pages
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build and verify Jekyll
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.8'
          bundler: '2.5.22'
      - name: Install locked dependencies
        run: ./scripts/bootstrap
      - name: Build production website
        run: ./scripts/build
      - name: Verify publication output
        run: ./scripts/verify-build
      - name: Upload Pages artifact
        if: github.event_name == 'workflow_dispatch' && inputs.publish == true && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Publish GitHub Pages
    if: github.event_name == 'workflow_dispatch' && inputs.publish == true && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
